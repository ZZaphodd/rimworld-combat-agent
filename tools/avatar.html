<style>
/* Layout: stage (3D avatar + speech bubble) left, control panel right; stacked on phones.
   One committed pastel stream-studio look; battle mode fades a dusk overlay over the stage. */
:root {
  --stage-a: #e7e2fb;
  --stage-b: #fde6dc;
  --battle-a: #2a2142;
  --battle-b: #7a2f3c;
  --panel: #fffaf6;
  --ink: #2f2838;
  --muted: #6e6479;
  --line: #ece3dc;
  --peace: #6fb35f;
  --battle: #e0443a;
  --display: "Jua", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --body: "Gowun Dodum", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  color-scheme: light;
}
html, body { height: 100%; }
body { background: var(--panel); color: var(--ink); font-family: var(--body); }
.app { display: grid; grid-template-columns: minmax(0, 1fr) 340px; height: 100%; }
.stage { position: relative; min-height: 0; overflow: hidden; background: linear-gradient(160deg, var(--stage-a), var(--stage-b)); touch-action: none; }
.battle-bg { position: absolute; inset: 0; background: radial-gradient(120% 90% at 50% 100%, var(--battle-b), var(--battle-a)); opacity: 0; transition: opacity .6s ease; }
.battle .battle-bg { opacity: 1; }
#c { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: pointer; }
.nameplate {
  position: absolute; left: 16px; bottom: 16px; display: flex; align-items: baseline; gap: 10px;
  background: rgba(255,255,255,.85); border: 1px solid rgba(47,40,56,.08);
  padding: 8px 14px; border-radius: 14px; font-family: var(--display);
}
.nameplate b { font-weight: 400; font-size: 20px; }
.nameplate span { font-size: 15px; color: var(--peace); }
.battle .nameplate span { color: var(--battle); }
.bubble {
  position: absolute; left: 50%; top: 18px; transform: translateX(-50%);
  width: min(78%, 420px); background: #fff; color: var(--ink);
  border-radius: 20px; padding: 14px 18px; font-family: var(--display); font-size: 19px; line-height: 1.4;
  box-shadow: 0 6px 0 rgba(47,40,56,.07); text-align: center; text-wrap: balance;
}
.battle .bubble { border-radius: 6px; box-shadow: 0 0 0 3px var(--battle), 0 6px 0 rgba(0,0,0,.25); }
.bubble::after { content: ""; position: absolute; left: 50%; bottom: -10px; margin-left: -10px; border: 10px solid transparent; border-bottom: 0; border-top-color: #fff; }
.bubble p { margin: 0; min-height: 1.4em; }
.panel { background: var(--panel); border-left: 1px solid var(--line); overflow-y: auto; padding-inline: 18px; padding-block: 18px 24px; display: flex; flex-direction: column; gap: 18px; }
.panel h2 { margin: 0 0 8px; font-family: var(--display); font-weight: 400; font-size: 15px; letter-spacing: .04em; color: var(--muted); }
.flavors { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.flavor {
  font-family: var(--display); font-size: 15px; cursor: pointer; color: var(--ink);
  background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 10px 6px 9px;
  display: flex; flex-direction: column; align-items: center; gap: 6px; transition: border-color .2s, box-shadow .2s;
}
.flavor i { width: 30px; height: 26px; border-radius: 50% 50% 46% 46% / 58% 58% 42% 42%; background: var(--sw); box-shadow: inset 0 -4px 0 rgba(0,0,0,.06), 0 0 0 1px rgba(47,40,56,.1); }
.flavor[aria-pressed="true"] { border-color: var(--ink); box-shadow: 0 0 0 1px var(--ink); }
.flavor:focus-visible { outline: 3px solid #f0708f; outline-offset: 2px; }
.modes { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; background: #f3ebe5; padding: 5px; border-radius: 16px; }
.mode {
  font-family: var(--display); font-size: 17px; cursor: pointer; border: 0; border-radius: 12px; padding: 11px 8px;
  background: transparent; color: var(--muted); transition: background .2s, color .2s;
}
.mode[data-mode="peace"][aria-pressed="true"] { background: var(--peace); color: #fff; }
.mode[data-mode="battle"][aria-pressed="true"] { background: var(--battle); color: #fff; }
.chips { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; }
.chip {
  font: inherit; text-align: left; cursor: pointer; color: var(--ink);
  background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 10px 14px;
  display: flex; align-items: baseline; justify-content: space-between; gap: 10px; transition: transform .1s, background .2s, border-color .2s;
}
.chip b { font-family: var(--display); font-weight: 400; font-size: 17px; }
.chip b i { font-style: normal; font-size: 13px; color: var(--muted); margin-left: 6px; }
.chip small { font-size: 13px; color: var(--muted); }
.chip:active { transform: scale(.97); }
.chip[aria-pressed="true"] { background: var(--peace); border-color: var(--peace); color: #fff; }
.battle-mode .chip[aria-pressed="true"] { background: var(--battle); border-color: var(--battle); }
.chip[aria-pressed="true"] :is(small, i) { color: rgba(255,255,255,.88); }
form { display: flex; gap: 8px; }
input[type=text] { flex: 1; min-width: 0; font: inherit; font-size: 16px; color: var(--ink); background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
.btn { font-family: var(--display); font-size: 16px; cursor: pointer; border-radius: 12px; padding: 10px 14px; background: #fff; color: var(--ink); border: 1px solid var(--line); }
.btn.primary { background: var(--ink); color: #fff; border-color: var(--ink); }
.btn[aria-pressed="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
.row .btn { flex: 1; }
:is(.chip, .btn, .mode, input):focus-visible { outline: 3px solid #f0708f; outline-offset: 2px; }
.hint { margin: 0; font-size: 13.5px; color: var(--muted); line-height: 1.55; }
@media (max-width: 760px) {
  .app { grid-template-columns: 1fr; grid-template-rows: 56svh auto; height: auto; }
  .panel { border-left: 0; border-top: 1px solid var(--line); overflow: visible; }
  .bubble { font-size: 17px; }
}
.obs body, .obs .stage { background: transparent; }
.obs .battle-bg { display: none; }
.obs .app { grid-template-columns: 1fr; }
.obs .panel, .obs .nameplate { display: none; }
@media (prefers-reduced-motion: reduce) { .chip, .mode, .battle-bg { transition: none; } }
</style>

    rig.position.set(x, y, 0);
    rig.rotation.z = lerp(rig.rotation.z, cur.tilt + .02 * Math.sin(swayT), .2);
    rig.rotation.x = lerp(rig.rotation.x, cur.lean, .2);
    deformBody(sx, sy, sz, shX, shZ, cur.wob, t);

    const faceK = Math.pow(.55, 2);
    face.scale.set(sx, sy, sz); face.position.set(shX * faceK, 0, shZ * faceK);

    // eyes: blink, gaze, battle lids and glow
    nextBlink -= dt; if (nextBlink < 0) { blink = 0; nextBlink = 2 + Math.random() * 3.5; }
    blink = Math.min(1, blink + dt * 7);
    nextSaccade -= dt; if (nextSaccade < 0) { gazeT.set((Math.random() - .5) * .5, (Math.random() - .5) * .3); nextSaccade = 1 + Math.random() * 2.5; }
    gaze.lerp(gazeT, Math.min(1, dt * 10));
    const eyeMode = E.eyes === 'happy' ? 'arc' : 'dot';
    const size = E.eyes === 'wide' ? 1.25 : 1, open = cur.open;
    eyes.forEach(ey => {
      ['dot', 'arc'].forEach(m => ey.w[m] = lerp(ey.w[m], m === eyeMode ? 1 : 0, Math.min(1, dt * 14)));
      const bl = Math.max(.08, Math.min(1, Math.abs(blink * 2 - 1)));
      ey.dot.scale.set(size * ey.w.dot + .001, size * open * bl * ey.w.dot + .001, 1);
      ey.arc.scale.setScalar(ey.w.arc + .001);
      ey.look.position.set(gaze.x * .06 * (1 - mw * .6), gaze.y * .05 * (1 - mw * .6), 0);
      const lw = mw * ey.w.dot; ey.lid.visible = lw > .02; ey.lid.scale.set(.17 * lw + .001, .075 * lw + .001, .045);
      ey.lid.position.y = .115 + (E.eyes === 'wide' ? .03 : 0);
      ey.glow.visible = cur.glow > .05; ey.glow.scale.set(.045 * cur.glow + .001, (.06 + .01 * Math.sin(t * 20)) * cur.glow + .001, .02);
      ey.browH.visible = cur.browVis > .04; ey.browH.scale.setScalar(Math.max(.001, cur.browVis));
      ey.browH.rotation.z = ey.side * cur.brow * .9;
      ey.browH.position.y = ey.browH.userData.y0 - Math.max(0, cur.brow) * .04 + (E.eyes === 'wide' ? .05 : 0);
    });
    blushes.forEach(b => { b.material.opacity = cur.blush * .55; });

    // mouth and fang
    talkOpen = lerp(talkOpen, talkTarget, Math.min(1, dt * 22)); talkTarget = lerp(talkTarget, 0, Math.min(1, dt * 9));
    const mo = clamp(cur.mouth[3] + talkOpen, 0, 1.2);
    buildMouth(cur.mouth[0], cur.mouth[1], cur.mouth[2] * (1 + .4 * Math.sin(t * 9)));
    mouthHole.scale.set(Math.max(.6, cur.mouth[0] * 6.5), mo + .001, 1); mouthHole.visible = mo > .03;
    const fw = Math.max(cur.fang, 0) * mw, fu = .55, fx = cur.mouth[0] * fu, fy = mouthY(fu, cur.mouth[1], 0) - .028;
    fang.visible = fw > .03; fang.scale.setScalar(fw + .001); fang.position.set(fx, fy, surfZ(fx, fy) + .02);

    // sprout springs; in battle the leaves stand up like a crest
    sprout.forEach((sp, i) => {
      const rest = cur.sprout * (i === 0 ? .45 : .35);
      const f = -ax * .045 + ay * .012 * Math.sign(rest + .05) + shV * .4;
      const kk = 70 * cur.stiff / (i + 1);
      sp.v += (-kk * (sp.a - rest) - 5 * sp.v + f * (1 + i * .6)) * dt; sp.a = clamp(sp.a + sp.v * dt, -1.6, 1.6);
      sp.g.rotation.z = -sp.a;
    });
    leaves.forEach(L => { L.leaf.rotation.z = (.5 + mw * .7) * L.s; L.leaf.scale.set(.13 + mw * .03, .05, .07 - mw * .02); });
    sproutRoot.position.set(shX, sy * .97 - .02, shZ);

    // headband with fluttering tails, battle only
    const bandK = Math.pow((BAND_Y + 1) * .5, 2);
    band.visible = mw > .02;
    band.scale.set(sx * mw + .001, mw + .001, sz * mw + .001);
    band.position.set(shX * bandK, BAND_Y * sy, shZ * bandK);
    tails.forEach(tl => tl.segs.forEach((sg, i) => {
      const flutter = Math.sin(t * 9 + i * 1.3 + tl.side) * (2.5 + cur.jitter * 80);
      const f = ay * .02 + ax * .03 * tl.side + flutter;
      sg.v += (-60 / (i + 1) * (sg.a - .35) - 4 * sg.v + f) * dt; sg.a = clamp(sg.a + sg.v * dt, -.6, 1.3);
      sg.g.rotation.z = -sg.a * tl.side * (i ? .6 : 1);
      sg.g.rotation.y = .25 * Math.sin(t * 7 + i * 1.7) * tl.side;
    }));

    // arms
    const pose = ARMS[E.arms];
    arms.forEach((a, i) => {
      tmpV.set(pose[i][0] * sx, pose[i][1] * sy, pose[i][2]);
      if (E.arms === 'wave') tmpV.y += .12 * Math.sin(t * 13 + i * Math.PI);
      if (E.arms === 'pump' && i === 1) tmpV.y += .1 * Math.abs(Math.sin(t * 6));
      if (cur.jitter > .008) { tmpV.x += Math.sin(t * 40 + i) * cur.jitter * .8; tmpV.y += Math.sin(t * 37 + i) * cur.jitter * .8; }
      armPos[i].lerp(tmpV, Math.min(1, dt * 9));
      a.position.copy(armPos[i]); a.position.x += shX * .3;
      a.scale.set(.19 * (1 - sq * .4), .22 * (1 + sq * .6), .19);
    });
    const pt = lerp(pad.scale.x, cur.pad > .5 ? 1 : .001, Math.min(1, dt * 10));
    pad.scale.setScalar(Math.max(.001, pt)); pad.position.set(shX * .25, -.64 * sy + .02 * Math.sin(t * 3), 1.0);

    // effects
    const on = n => E.fx.includes(n);
    for (const n in FX) FX[n].w = lerp(FX[n].w, on(n) ? 1 : 0, Math.min(1, dt * 8));
    const ex = FX.exclaim; ex.s.visible = ex.w > .02; ex.s.position.set(.35, 1.45 * sy, .2); ex.s.scale.setScalar(.6 * ex.w * (1 + .15 * Math.sin(t * 9)));
    const al = FX.alert, alS = al.w * (1 + .12 * Math.sin(t * 14));
    [al.back, al.s].forEach((sp, i) => { sp.visible = al.w > .02; sp.position.set(.6, 1.42 * sy - (i ? .02 : 0), .2 + i * .02); sp.scale.setScalar((i ? .36 : .62) * alS + .001); });
    const an = FX.anger; an.s.visible = an.w > .02; an.s.position.set(.7, .8 * sy, .55); an.s.scale.setScalar(.42 * an.w * (1 + .18 * Math.max(0, Math.sin(t * 8))) + .001);
    FX.sparkle.list.forEach((sp, i) => { const a = t * .8 + i * Math.PI / 2; sp.visible = FX.sparkle.w > .02; sp.position.set(Math.cos(a) * 1.45, .4 + Math.sin(a * 1.3) * .5, Math.sin(a) * .5 + .3); sp.scale.setScalar(.26 * FX.sparkle.w * (.6 + .4 * Math.abs(Math.sin(t * 4 + i))) + .001); });
    FX.stars.list.forEach((sp, i) => { const p = (t * .9 + i / 6) % 1, a = i * 1.05; sp.visible = FX.stars.w > .02; sp.position.set(Math.cos(a) * (.9 + p * .9), .9 + p * 1.1, Math.sin(a) * .4 + .4); sp.scale.setScalar(.18 * FX.stars.w * Math.sin(p * Math.PI) + .001); sp.material.rotation = p * 3; });
    FX.sparks.list.forEach((sp, i) => { const p = (t * 1.6 + i / 8) % 1, a = i * .79; sp.visible = FX.sparks.w > .02; sp.position.set(Math.cos(a) * (.7 + p * 1.3), .2 + Math.sin(a) * .2 + p * 1.2, .5); sp.scale.setScalar(.16 * FX.sparks.w * (1 - p) + .001); sp.material.rotation = p * 5; });
    FX.flames.list.forEach(f => {
      const p = (t * 1.3 + f.userData.off) % 1, a = f.userData.ang + t * .4;
      f.visible = FX.flames.w > .02;
      f.position.set(Math.cos(a) * 1.05 * sx, -.75 * sy + p * 2.0, Math.sin(a) * .9 - .25);
      const sc = (.45 + .25 * Math.sin(f.userData.ang * 3)) * Math.sin(p * Math.PI) * FX.flames.w + .001;
      f.scale.set(sc, sc * 1.4, 1); f.material.opacity = .85 * FX.flames.w;
    });
    const te = FX.tears;
    if (on('tears')) {
      te.timer -= dt;
      if (te.timer < 0) {
        te.timer = mode === 'battle' ? .3 : .14;
        const d = te.pool.find(q => q.life <= 0);
        if (d) { const side = Math.random() < .5 ? -1 : 1; d.life = 1.1; d.m.visible = true; d.m.position.set(.33 * side * sx, .02 * sy, .92); d.v.set(side * (.35 + Math.random() * .3), .5, .35); }
      }
    }
    te.pool.forEach(d => { if (d.life <= 0) return; d.life -= dt; d.v.y -= 6 * dt; d.m.position.addScaledVector(d.v, dt); if (d.life <= 0 || d.m.position.y < -y) { d.life = 0; d.m.visible = false; } });

    shadow.position.x = x; const shs = 1 - hopY * .6; shadow.scale.set(sx * shs, shs, 1); shadow.material.opacity = .9 - hopY;
    if (ringT < 1) { ringT += dt * 1.6; const r = .8 + ringT * 2.6; ring.scale.set(r, r, 1); M.ring.opacity = Math.max(0, 1 - ringT) * .8; ring.visible = true; } else ring.visible = false;

    // speech typing and the demo script
    if (line) {
      if (shown < line.length) {
        typeT -= dt;
        if (typeT <= 0) {
          const ch = line[shown++]; bubbleText.textContent = line.slice(0, shown);
          typeT = /[.,!?…~ ]/.test(ch) ? .11 : (mode === 'battle' ? .048 : .055);
          if (!/[\s.,!?…~]/.test(ch)) { talkTarget = .45 + Math.random() * .55; blip(); sqv -= .8; }
        }
      } else {
        holdT += dt;
        if (holdT > 1.7 + line.length * .03) {
          if (demo >= 0) {
            demo++;
            if (demo >= SCRIPT.length) { stopDemo(); line = ''; bubble.hidden = true; }
            else say(SCRIPT[demo][2], SCRIPT[demo][1], SCRIPT[demo][0]);
          } else { line = ''; bubble.hidden = true; }
        }
      }
    }
    if (sulk > 0) { sulk -= dt; if (sulk <= 0 && demo < 0) setEmotion(sulkPrev || 'calm'); }

    renderer.render(scene, camera);
    requestAnimationFrame(tick);
  }
  tick();
})();
</script>
